name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - simplify/whatsapp-electronics-catalogue

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run test suite
        env:
          SECRET_KEY: test-secret-for-ci-only
        run: python -m pytest -q
