<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="{{ business.brand_color if business and business.brand_color else '#24251f' }}">
  <meta name="description" content="{% block meta_description %}Clothing catalogue{% endblock %}">
  <title>{% block title %}Clothing Catalogue{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body id="top" class="{% block body_class %}{% endblock %}">
  {% block body %}{% endblock %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded',function(){const toggle=document.querySelector('.menu-toggle');if(toggle){toggle.addEventListener('click',function(){const menu=document.querySelector('#store-menu');const expanded=this.getAttribute('aria-expanded')==='true';this.setAttribute('aria-expanded',String(!expanded));menu.classList.toggle('is-open',!expanded);});}});
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
